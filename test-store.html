<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PeakPals — PP Monogram Knit Sweater</title>
  <link rel="stylesheet" href="/store.css" />
  <style>
    main { display: flex; gap: 48px; padding: 48px 40px; max-width: 1000px; }
    .shot { width: 380px; height: 500px; object-fit: cover; background: #efe7dd; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    .price { font-size: 20px; color: #555; }
    p { line-height: 1.6; color: #444; }
    .sizes button { padding: 8px 14px; margin-right: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-family: inherit; }
    .buy { margin-top: 24px; padding: 14px 28px; background: #1d1d1d; color: #fff; border: 0; cursor: pointer;
      letter-spacing: .1em; font-family: system-ui, sans-serif; font-size: 13px; }
    .ask { display: inline-block; margin-top: 12px; padding: 13px 24px; background: #fff; color: #7a2f3a;
      border: 1px solid #7a2f3a; text-decoration: none; font-family: system-ui, sans-serif; font-size: 14px;
      font-weight: 600; }
    @media (max-width: 720px) {
      main { flex-direction: column; gap: 24px; padding: 24px 20px; }
      .shot { width: 100%; height: auto; }
      .buy, .ask { display: block; width: 100%; text-align: center; box-sizing: border-box; }
    }
  </style>
</head>
<body>
  <header class="store-header">
    <a class="store-brand" href="/">PEAKPALS</a>
    <nav class="store-nav"><a href="/ask">✦ Ask Pal</a></nav>
  </header>

  <main>
    <img class="shot" src="/images/swt-001.jpeg" alt="PP Monogram Knit Sweater" />
    <div>
      <h1>PP Monogram Knit Sweater — Charcoal</h1>
      <div class="price">₹1,899</div>
      <p>Charcoal crewneck knit with a cream interlocking PP monogram across the chest. Ribbed collar, cuffs and hem.</p>
      <div class="sizes"><button>S</button><button>M</button><button>L</button><button>XL</button></div>
      <button class="buy">ADD TO BAG</button>
      <a class="ask" href="/ask?product=swt-001">Ask Pal about this item</a>
    </div>
  </main>

  <!-- The floating widget still builds and is still embeddable on third-party sites
       (see README). This store links to /ask instead:
       <script src="/embed.js" data-product-id="swt-001"></script> -->
</body>
</html>
