<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>PeakPals — PP Monogram Knit Sweater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    main { display: flex; gap: 64px; padding-top: 48px; align-items: flex-start; }
    .shot { flex: none; width: 46%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--c-surface); }
    .detail { padding-top: 8px; }
    .detail h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-h2); color: var(--c-text); margin: 0 0 12px; line-height: 1.2; }
    .price { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--c-text); }
    .desc { font-family: var(--font-body); font-weight: 300; font-size: var(--fs-body); line-height: 1.6; color: var(--c-text); margin: 18px 0 26px; }
    .sizes button { padding: 10px 16px; margin: 0 8px 8px 0; border: 1px solid var(--c-search-border); background: var(--c-bg); cursor: pointer; font-family: var(--font-body); font-size: 14px; }
    .sizes button:hover { border-color: var(--c-ink); }
    .buy { margin-top: 20px; padding: 15px 30px; background: var(--c-ink); color: var(--c-white); border: 0; cursor: pointer; letter-spacing: .1em; font-family: var(--font-body); font-size: 13px; }
    .ask { display: inline-block; margin-top: 12px; padding: 14px 26px; background: var(--c-bg); color: var(--c-ink); border: 1px solid var(--c-ink); text-decoration: none; font-family: var(--font-body); font-size: 14px; }
    .ask:hover { background: var(--c-surface); }
    @media (max-width: 720px) {
      main { flex-direction: column; gap: 24px; }
      .shot { width: 100%; }
      .buy, .ask { display: block; width: 100%; text-align: center; box-sizing: border-box; }
    }
  </style>
</head>
<body>
  <header class="store-header">
    <a class="store-brand" href="/"><img src="/images/site/logo-peakpals.png" alt="PeakPals" /></a>
    <nav class="store-nav"><a href="/ask">Ask Pal</a></nav>
  </header>

  <main class="wrap">
    <img class="shot" src="/images/swt-001.jpeg" alt="PP Monogram Knit Sweater" />
    <div class="detail">
      <h1>PP Monogram Knit Sweater — Charcoal</h1>
      <div class="price">₹1,899</div>
      <p class="desc">Charcoal crewneck knit with a cream interlocking PP monogram across the chest. Ribbed collar, cuffs and hem.</p>
      <div class="sizes"><button>S</button><button>M</button><button>L</button><button>XL</button></div>
      <button class="buy">ADD TO BAG</button>
      <a class="ask" href="/ask?product=swt-001">Ask Pal about this item</a>
    </div>
  </main>
</body>
</html>
